- Title: My Journey to a Ham Radio License
  Background: N2VLV_Extra.png
  Description: |
    When I was in Junior High School we visited a family friend
    who was an amateur radio operator.  I was intrigued by
    his ham shack.  He ended up giving me a Hallicrafters
    short wave receiver.

    Back at school I would carry around the
    [AARL](https://www.arrl.org){:target="_blank" rel="noopener"} [Handbook](https://www.arrl.org/arrl-handbook-2023){:target="_blank" rel="noopener"}; back then
    it was on paper and the size of a major city phone book (if you
    are too young to know what that is, Google it). In High School I
    joined the local Civil Defense with the idea of taking classes to
    study for my amateur radio license. However, the folks that ran
    Civil Defense were not ready to deal with exuberant teenagers and
    nothing came of it.

    Then I got distracted by CB radio and communicated with
    friends that way until I went to college. At one point I
    tried mounting a 6' whip to my bicycle and powering a
    mobile CB with a battery pack. But there wasn't enough
    power in the NiCad packs of the day and it did not
    really work.

    When I went to college I forgot about Ham Radio in
    general.  After college, when I was working at the
    Clarkson University Computing Center I initiated a
    project to get business-band radios for the techs to
    carry around to stay in contact.

    Now that I'm retired I figured I can spend the time to study for
    my license. I asked a neighbor friend who happens to be the
    president of the [Tompkins County Amateur Radio
    Association](https://tcara-ny.org){:target="_blank" rel="noopener"} for recommendations to study
    for the exam. He recommended finding online tests and keep taking
    them until I pass. I eventually ended up on
    [hamstudy.org](https://hamstudy.org){:target="_blank" rel="noopener"} and their Android app and
    took a couple dozen Technician exams and several dozen General
    exams. Several weeks later I took the exams on August 2, 2025; I
    aced the Technician exam and passed the General exam with 30 of 35
    correct. I was initially assigned a call sign of
    <strong>KE2GMJ</strong>.

    On August 23, 2025 my vanity call sign came through. I'm
    now [N2VLV](https://www.qrz.com/db/N2VLV){:target="_blank" rel="noopener"} (as in VoLVo).

    While taking the Technician and General practice exams, I took
    a practice exam for Amateur Extra and did horribly. Over the
    next six weeks I kept studying and started passing, achieving
    as high as 48 on two practice exams. On September 20, 2025 I
    sat for the Amateur Extra exam and passed with 46 of 50
    correct!

    I submitted my open book exam to be
    an ARRL accredited
    [Volunteer Examiner](https://www.arrl.org/volunteer-examiners){:target="_blank" rel="noopener"}.
    Instead of taking
    3–4 weeks, my paperwork arrived exactly a week later.

    ![Image of Jeff's AARL Volunteer Examiner Certificate](images/N2VLV_VE_Certificate.jpg){: width="75%" height="auto" }

- Title: About my call sign
  Description: |
    What does N2VLV stand for?

    If you know me, you know I'm into Volvos, both new and old.  So when I
    wanted a vanity call sign, I found that N2VLV was available and
    applied for it.

    The outline in background of my favicon (displayed full size
    below) is of a Volvo PV544.
    I have a [1959](https://flic.kr/s/aHsmWyrL7o){: .external-link-flickr} that I am restoring.

    ![Large version of Jeff's Favicon with an outline of a Volvo PV544](images/n2vlv.png){: width="75%" height="auto" }

- Title: AllStarLink
  Description: |
    [AllStarLink](https://allstarlink.org){:target="_blank" rel="noopener"} is a VoIP-based network
    that connects amateur radio repeaters and nodes around the world.  I use it to access repeaters
    in areas where I don't have RF coverage (my basement office) —
    allowing me to participate in nets and ragchews on distant repeaters from home or while traveling.

    I have a hotspot running in my house so that I can carry a small
    HT around and connect to AllStarLink nodes while I roam the house.

    Then I set up an AllStarLink node for [W4ZBB (Playground Amateur
    Radio Club)](https://w4zbb.org){:target="_blank" rel="noopener"}
    to allow remote access to their repeater.  Now I can join in their
    nets from back home in New York.

    I gave the following presentation about AllStarLink at W4ZBB's club tech night and have also
    given this presentation at the
    [Tompkins County Amateur Radio Association](https://tcara-ny.org){:target="_blank" rel="noopener"}:

    - [Introduction to AllStarLink](https://jchonig.github.io/pres-allstar/){:target="_blank" rel="noopener"} — an overview of what AllStarLink is and how it works

    I later developed a presentation on setting up a
    hotspot and other ways to access a repeater remotely.

    - [AllStarLink Hotspot](https://jchonig.github.io/pres-allstar/hotspot.html){:target="_blank" rel="noopener"} — setting up a personal AllStarLink hotspot node

    The slides and source for both presentations are available in my
    [GitHub repository](https://github.com/jchonig/pres-allstar){:target="_blank" rel="noopener"}.

    I also wrote [YAAMon](#yaamon), a modern web application for monitoring and managing AllStarLink nodes.

- Title: YAAMon
  Description: |
    [YAAMon (Yet Another AllStar MONitor)](https://github.com/jchonig/allstar-yaamon){:target="_blank" rel="noopener"}
    is a modern, responsive web application for managing and monitoring
    [AllStarLink](https://allstarlink.org){:target="_blank" rel="noopener"} nodes.
    It replaces the PHP/Apache-based
    [AllScan](https://github.com/davidgsd/AllScan){:target="_blank" rel="noopener"} and
    [Allmon3](https://github.com/AllStarLink/Allmon3){:target="_blank" rel="noopener"}
    with a single self-contained binary — no web server, no PHP runtime, and no external
    database required. The interface works on desktops, tablets, and phones.

    Key features:

    - Single static binary with no external dependencies
    - Built-in TLS with automatic Let's Encrypt certificates and HTTP/3 (QUIC)
    - Docker and docker-compose ready
    - Multi-user with role-based access (superuser / admin / readwrite / readonly)
    - Live dashboard with SSE-pushed updates — no page refresh needed
    - Passkey / WebAuthn (FIDO2) authentication support
    - Manages multiple Asterisk/AMI nodes from one interface
    - Encrypted backup and restore
