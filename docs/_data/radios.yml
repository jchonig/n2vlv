- Title: Hallicrafters S-107
  Background: https://live.staticflickr.com/65535/55564492390_85874f7dbd_b.jpg
  Description: |
    # My introduction to the hobby

    This radio was given to me in the early 1970s by family friends.
    It was my introduction to Ham radio.

    I recently found it tucked away in a dark corner of our store
    room.  Quite dusty, a bit rusty.

    I haven't decided if I want to restore it.  I've been reading and
    probably need to replace all the caps.  I also remember playing
    with the tuning of the inductors when I was a teen, I'm sure it's
    way out of tune.
